name: atlas_link_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.3
  flutter_acrylic: ^1.1.4
  flutter_markdown: ^0.7.3
  crypto: ^3.0.7
  ffi: ^2.1.4
  win32: ^5.10.1
  version: ^3.0.2
  path: ^1.9.1
  font_awesome_flutter: ^10.8.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.7.2

flutter_launcher_icons:
  image_path: "assets/images/atlas_logo.png"
  web:
    generate: true
    image_path: "assets/images/atlas_logo.png"
    background_color: "#000000"
    theme_color: "#5935FF"
  windows:
    generate: true
    image_path: "assets/images/atlas_logo.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/dlls/
    - assets/seasons/
    - assets/backend/
    - assets/backend/bin/
    - assets/backend/node/
    - assets/backend/lawinserver/
    - assets/backend/lawinserver/CloudStorage/
    - assets/backend/lawinserver/Config/
    - assets/backend/lawinserver/profiles/
    - assets/backend/lawinserver/public/
    - assets/backend/lawinserver/public/images/
    - assets/backend/lawinserver/responses/
    - assets/backend/lawinserver/responses/Athena/
    - assets/backend/lawinserver/responses/Athena/BattlePass/
    - assets/backend/lawinserver/responses/Athena/Discovery/
    - assets/backend/lawinserver/responses/Campaign/
    - assets/backend/lawinserver/responses/CloudDir/
    - assets/backend/lawinserver/structure/
    - assets/backend/neonite_v2/
    - assets/backend/neonite_v2/api/
    - assets/backend/neonite_v2/api/controllers/
    - assets/backend/neonite_v2/config/
    - assets/backend/neonite_v2/discovery/
    - assets/backend/neonite_v2/discovery/mnemonic_overwrite/
    - assets/backend/neonite_v2/discovery/mnemonic_overwrite/figment/
    - assets/backend/neonite_v2/hotfixes/
    - assets/backend/neonite_v2/LauncherAssets/
    - assets/backend/neonite_v2/profile_template/
    - assets/backend/neonite_v2/profile_template/profiles/
    - assets/backend/neonite_v2/responses/
    - assets/backend/neonite_v2/responses/catalog/
    - assets/backend/neonite_v2/structs/
    
