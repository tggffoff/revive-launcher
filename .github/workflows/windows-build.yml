name: Revive Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Revive for Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Update incompatible Font Awesome lockfile entry
        working-directory: atlas_link_flutter
        run: flutter pub upgrade font_awesome_flutter

      - name: Resolve dependencies
        working-directory: atlas_link_flutter
        run: flutter pub get

      - name: Build Windows release
        working-directory: atlas_link_flutter
        run: flutter build windows --release

      - name: Verify complete Flutter release bundle
        shell: pwsh
        run: |
          $release = "atlas_link_flutter/build/windows/x64/runner/Release"
          if (!(Test-Path $release)) { throw "Release directory missing: $release" }
          $exe = Get-ChildItem $release -Filter "*.exe" -File | Select-Object -First 1
          if (!$exe) { throw "No application EXE found in $release" }
          if (!(Test-Path "$release/data/app.so")) { throw "Missing data/app.so" }
          if (!(Test-Path "$release/data/flutter_assets")) { throw "Missing data/flutter_assets" }
          if (!(Test-Path "$release/flutter_windows.dll")) { throw "Missing flutter_windows.dll" }
          Write-Host "Verified release bundle: $($exe.Name)"
          Get-ChildItem $release -Force | Format-Table Name, Length

      - name: Upload complete Windows release folder
        uses: actions/upload-artifact@v4
        with:
          name: Revive-Windows-Release-Full
          path: atlas_link_flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
