name: Revive Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Revive for Windows
    runs-on: windows-latest

    steps:
      - name: Download Revive source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Clean Flutter cache & get dependencies
        working-directory: atlas_link_flutter
        run: |
          flutter clean
          flutter pub cache clean -f
          flutter pub get

      - name: Compile Revive
        working-directory: atlas_link_flutter
        run: flutter build windows --release

      - name: Upload Revive Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Revive-Windows
          path: atlas_link_flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          
