name: Revive Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Revive for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.lock currently pins font_awesome_flutter 10.12.0,
      # which is incompatible with the Dart SDK used by the Windows runner.
      - name: Upgrade Font Awesome dependency
        working-directory: atlas_link_flutter
        run: flutter pub upgrade font_awesome_flutter

      - name: Install dependencies
        working-directory: atlas_link_flutter
        run: flutter pub get

      - name: Build Windows release
        working-directory: atlas_link_flutter
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Revive-Windows
          path: atlas_link_flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
